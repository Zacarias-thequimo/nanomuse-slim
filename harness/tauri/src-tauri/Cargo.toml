[package]
name = "nanomuse-desktop-tauri"
version = "0.1.40"
edition = "2021"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-single-instance = "2"
tokio = { version = "1", features = ["process", "rt-multi-thread", "macros", "time"] }
serde_json = "1"

[profile.release]
# the 4 GB box: no debug info in the release binary, one codegen unit per crate
# keeps peak rustc memory down at the cost of a slower build.
debug = 0
codegen-units = 1
